@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* geral */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}

<div id="bgPh"><div></div><div></div></div>

<div id="hint">Espaço/Enter = próximo · ← voltar · R repetir · T tela cheia · H esconde esta linha</div>
<div id="warn" class="hidden"></div>
<div id="start"><div class="statue">🏆</div><div class="disp goldtxt">CLIQUE PARA COMEÇAR</div><div style="color:#a39588">(libera o som da cerimônia)</div></div>

<script>
const $=s=>document.querySelector(s);
const O=window.OSCAR,{C,store,esc,unitOf,avatar}=O;
const chipBig=id=>{const u=unitOf(id);return `<span class="chip" style="background:${u.cor}">${esc(u.nome)}</span>`};

/* ===================== som (Web Audio, sem arquivos) ===================== */
let ac=null,master=null,noise=null,roll=null;
function audio(){
  if(ac){if(ac.state==='suspended')ac.resume();return ac}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=0.85;master.connect(comp);comp.connect(ac.destination);
  noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return ac;
}
function nz(t,dur,type,freq,q,gain,attack=0.002){
  const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);return f;
}
function tone(t,freq,dur,type,gain,attack=0.01,glideTo=null){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function snare(t,g){nz(t,0.11,'bandpass',1900,0.8,g);tone(t,190,0.07,'triangle',g*0.5)}
function drumStart(){
  if(!ac)return;drumStop();const t0=ac.currentTime;let next=t0+0.05,k=0;
  roll=setInterval(()=>{const now=ac.currentTime;while(next<now+0.15){const el=next-t0,gap=Math.max(0.034,0.075-el*0.006),g=Math.min(0.55,0.16+el*0.05);snare(next,g*(k++%2?0.85:1));next+=gap}},40);
}
function drumStop(){if(roll){clearInterval(roll);roll=null}}
function crash(){if(!ac)return;const t=ac.currentTime;nz(t,2.8,'highpass',5200,0.5,0.6);nz(t,1.2,'bandpass',3000,0.6,0.35);tone(t,95,0.9,'sine',0.9,0.005,38)}
function whoosh(){if(!ac)return;const t=ac.currentTime,f=nz(t,0.55,'bandpass',500,1.4,0.25,0.18);f.frequency.exponentialRampToValueAtTime(3200,t+0.5)}
function shimmer(){if(!ac)return;const t=ac.currentTime,sc=[1047,1175,1319,1568,1760,2093];for(let i=0;i<10;i++)tone(t+i*0.09,sc[(i*3)%sc.length],0.9,'sine',0.08,0.005)}
function fanfare(){
  if(!ac)return;const t=ac.currentTime,brass=(st,f,d,g=0.16)=>{[1,1.003].forEach(det=>{const o=ac.createOscillator(),fl=ac.createBiquadFilter(),gn=ac.createGain();o.type='sawtooth';o.frequency.value=f*det;fl.type='lowpass';fl.frequency.setValueAtTime(600,st);fl.frequency.linearRampToValueAtTime(3200,st+0.08);fl.frequency.linearRampToValueAtTime(1800,st+d);gn.gain.setValueAtTime(0,st);gn.gain.linearRampToValueAtTime(g,st+0.04);gn.gain.setValueAtTime(g*0.85,st+d-0.05);gn.gain.linearRampToValueAtTime(0,st+d);o.connect(fl);fl.connect(gn);gn.connect(master);o.start(st);o.stop(st+d+0.05)})};
  const G4=392,C5=523,E5=659,G5=784,C6=1047;
  [[0,G4,.16],[.18,G4,.16],[.36,G4,.16],[.54,C5,.5],[1.08,E5,.22],[1.32,G5,.22],[1.56,C6,1.4]].forEach(([d,f,l])=>brass(t+d,f,l));
  [C5,E5,G5].forEach(f=>brass(t+1.56,f,1.4,0.09));tone(t+1.56,65,1.2,'sine',0.5,0.01,60);
}
function tick(hi){if(!ac)return;tone(ac.currentTime,hi?1320:880,0.08,'square',0.08,0.002)}
function playoff(){if(!ac)return;const t=ac.currentTime;[523,659,784,659,523,392,523].forEach((f,i)=>tone(t+i*0.15,f,0.14,'square',0.07,0.005))}

/* ===================== confete ===================== */
function confetti(n=160){const c=$('#confetti'),cols=['#e3bf6f','#fff1c4','#b08a3a','#c41d2c','#ffffff','#d67e59'];
  for(let i=0;i<n;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(2.4+Math.random()*2.8)+'s';d.style.animationDelay=Math.random()*1.2+'s';d.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(d)}
  setTimeout(()=>{c.innerHTML=''},6500)}

/* ===================== dados ===================== */
let CFG=O.CFG0,CATS=[],FIN=[],VOTES=[],PERF=[],PH=[];
async function load(){
  try{
    CFG=await O.getConfig();CATS=(await O.getCats()).filter(c=>c.ativa);
    [FIN,VOTES,PERF,PH]=await Promise.all([store.list('oscar_finalists'),store.list('oscar_votes'),store.list('performances'),store.list('oscar_photos')]);
    PH=PH.filter(p=>p.status==='approved');
  }catch(e){console.error(e)}
  buildSteps();renderWarn();
}
let loadT=null;
store.on(()=>{clearTimeout(loadT);loadT=setTimeout(load,600)},[...O.TABLES,'performances']);
function renderWarn(){
  const w=$('#warn');
  if(store.mode==='supabase'&&!ADMIN){w.textContent='🔒 Sem login: não dá para ler os votos';w.classList.remove('hidden');return}
  if(CFG.fase==='indicacao'||CFG.fase==='votacao'){w.textContent='⚠️ Fase atual: '+O.FASES[CFG.fase]+' (ensaio? Os votos ainda estão abertos)';w.classList.remove('hidden')}
  else w.classList.add('hidden');
}

/* resultados de cada categoria */
function resultOf(c){
  if(c.tipo==='voz_karaoke'){const v=O.vozDoAno(PERF);return{finalists:v.finalists.map(p=>({name:p.name,unit:p.unit,sub:'nota '+p.final+(p.song?' · '+p.song:'')})),winners:v.winners.map(p=>({name:p.name,unit:p.unit,sub:'nota '+p.final+(p.song?' · '+p.song:'')})),total:PERF.length}}
  const r=O.winnersOf(c.id,FIN,VOTES);
  const ord=r.finalists.sort((a,b)=>(a.ordem-b.ordem)||a.name.localeCompare(b.name,'pt'));
  return{finalists:ord,winners:r.winners,total:r.total};
}
function podium(){
  const R={};CATS.filter(c=>c.tipo!=='unidade').forEach(c=>{if(c.tipo==='voto'&&!FIN.some(f=>f.category_id===c.id))return;R[c.id]={winners:resultOf(c).winners}});
  return O.unidadeDoAno(O.winsByUnit(R),PERF,CFG);
}

/* ===================== roteiro de passos ===================== */
let STEPS=[],I=0;
function buildSteps(){
  const cur=STEPS[I]&&STEPS[I].id;
  const S=[{id:'abertura',k:'abertura',label:'🎬 Abertura'}];
  // retrospectiva do karaokê (dá para desligar no admin)
  if(CFG.retro!==false&&O.retro(PERF).total>0)S.push({id:'retro1',k:'retro',p:1,label:'🎞️ Retrospectiva: números da noite'},{id:'retro2',k:'retro',p:2,label:'🎞️ Retrospectiva: destaques'});
  const cs=CATS.filter(c=>c.tipo==='unidade'||(c.tipo==='voto'?FIN.some(f=>f.category_id===c.id):PERF.length));
  cs.forEach((c,n)=>{
    const L=s=>`${c.emoji||'🏆'} ${c.nome}: ${s}`;
    if(c.tipo==='unidade'){
      S.push({id:'titulo:'+c.id,k:'titulo',c,n,label:L('apresentação')});
      [3,2,1].forEach(p=>S.push({id:'podio'+p+':'+c.id,k:'podio',c,p,label:L(p+'º lugar')}));
      return;
    }
    S.push({id:'titulo:'+c.id,k:'titulo',c,n,label:L('apresentação')},{id:'ind:'+c.id,k:'indicados',c,label:L('indicados')},{id:'env:'+c.id,k:'envelope',c,label:L('envelope 🥁')},{id:'win:'+c.id,k:'vencedor',c,label:L('VENCEDOR')});
    if(+CFG.discurso_seg>0)S.push({id:'disc:'+c.id,k:'discurso',c,label:L('discurso')});
  });
  S.push({id:'fim',k:'fim',label:'🎉 Encerramento'});
  STEPS=S;STEPS.nCat=cs.length;
  const j=cur?STEPS.findIndex(s=>s.id===cur):-1;
  if(j>=0)I=j;else I=Math.min(I,STEPS.length-1);
  sendState();
}

/* ===================== cenas ===================== */
let timers=[],cdTimer=null;
function clearScene(){timers.forEach(clearTimeout);timers=[];clearInterval(cdTimer);cdTimer=null;drumStop();$('#confetti').innerHTML=''}
const later=(ms,f)=>timers.push(setTimeout(f,ms));
const scene=html=>{$('#scene').innerHTML=html};

/* fotos aprovadas passando no fundo (abertura e encerramento) */
let phT=null,phI=0;
function photos(on){
  clearInterval(phT);const L=[...$('#bgPh').children];
  if(!on||!PH.length){L.forEach(x=>x.classList.remove('on'));return}
  const show=()=>{if(!PH.length){L.forEach(x=>x.classList.remove('on'));return}const p=PH[phI++%PH.length],el=L[phI%2];el.style.backgroundImage=`url("${p.url.replace(/"/g,'%22')}")`;el.classList.add('on');L[(phI+1)%2].classList.remove('on')};
  show();phT=setInterval(show,5000);
}

async function saveResult(c,winners,extra={}){
  if(store.mode==='supabase'&&!ADMIN)return;
  const res={...(CFG.resultado||{}),[c.id]:{winners:winners.map(w=>({name:w.name,unit:w.unit,photo_url:w.photo_url||null})),...extra}};
  CFG.resultado=res;try{await store.upsert('oscar_config',[{id:'main',resultado:res,updated_at:new Date().toISOString()}])}catch(e){console.error(e)}
}

function show(){
  clearScene();const s=STEPS[I];if(!s)return;photos(s.k==='abertura'||s.k==='fim');
  const c=s.c;
  if(s.k==='abertura'){
    scene(`<div class="in"><div class="statue">🏆</div><div class="op-k">${esc(C.MARCA.toUpperCase())} APRESENTA</div>
      <div class="op-t disp goldtxt">OSCAR<span class="shine disp">OSCAR</span></div><div class="op-s disp goldtxt">${esc(O.titulo.replace(/^OSCAR\s*/i,''))}</div>
      <div class="c-d" style="font-style:normal">${esc(C.EVENTO)}</div></div>`);
    shimmer();
  }
  else if(s.k==='retro'){
    const R=O.retro(PERF);let cards;
    if(s.p===1)cards=[['🎤',R.total,R.total===1?'música cantada':'músicas cantadas'],['🙋',R.cantores,R.cantores===1?'cantor(a)':'cantores'],['👯',R.duetos,R.duetos===1?'dueto':'duetos'],['⭐',R.media,'nota média da noite']].map(([i,v,l])=>`<div class="rs"><div class="ri">${i}</div><div class="rv disp goldtxt" data-n="${v}">0</div><div class="rl">${l}</div></div>`);
    else cards=[
      R.primeira&&['🥇','Abriu a noite',R.primeira.name,R.primeira.unit,R.primeira.song],
      R.musica&&['🔁','Música mais cantada',R.musica.song,null,R.musica.n+' vezes'],
      R.cantor&&['🎙️','Dono(a) do microfone',R.cantor.name,R.cantor.unit,R.cantor.n+' músicas'],
      R.unidade&&['🏢','Unidade mais animada',unitOf(R.unidade.unit).nome,null,R.unidade.n+' apresentaç'+(R.unidade.n===1?'ão':'ões')]
    ].filter(Boolean).map(([i,l,v,u,x])=>`<div class="rs"><div class="ri">${i}</div><div class="rl">${l}</div><div class="rv t disp goldtxt">${esc(v)}</div>${u?chipBig(u):''}${x?`<div class="rx">${esc(x)}</div>`:''}</div>`);
    scene(`<div class="c-n in">🎞️ RETROSPECTIVA DO KARAOKÊ</div><div class="ind-h disp goldtxt in" style="margin:1vh 0 0">${s.p===1?'A NOITE EM NÚMEROS':'OS DESTAQUES'}</div><div class="rg">${cards.join('')}</div>`);
    [...document.querySelectorAll('.rs')].forEach((el,i)=>later(700+i*1100,()=>{el.classList.add('show');whoosh();
      const v=el.querySelector('[data-n]');if(v){const n=+v.dataset.n,t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/1200);v.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1&&v.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)}}));
  }
  else if(s.k==='titulo'){
    scene(`<div class="in"><div class="c-n">CATEGORIA ${s.n+1} DE ${STEPS.nCat}</div><div class="c-em pop">${esc(c.emoji||'🏆')}</div>
      <div class="c-t disp goldtxt">${esc(c.nome)}</div>${c.descricao?`<div class="c-d">“${esc(c.descricao)}”</div>`:''}</div>`);
    whoosh();
  }
  else if(s.k==='indicados'){
    const r=resultOf(c),fs=r.finalists;
    scene(`<div class="ind-h disp goldtxt in">E OS INDICADOS SÃO...</div><div class="noms">${fs.map(f=>`<div class="nom">${avatar(f.name,f.unit,f.photo_url)}<div class="nn disp">${esc(f.name)}</div>${chipBig(f.unit)}${f.sub?`<div class="sc">${esc(f.sub)}</div>`:''}</div>`).join('')}</div>`);
    const els=[...document.querySelectorAll('.nom')];
    els.forEach((el,i)=>later(900+i*1400,()=>{el.classList.add('show');whoosh()}));
    if(!fs.length)scene('<div class="ind-h disp goldtxt">Sem indicados nesta categoria</div>');
  }
  else if(s.k==='envelope'){
    scene(`<div class="env-h disp goldtxt in">O ENVELOPE, POR FAVOR...</div>${envHtml(c,'shake')}`);
    drumStart();
  }
  else if(s.k==='vencedor'){
    const r=resultOf(c),ws=r.winners;
    scene(`<div style="margin-top:20vh">${envHtml(c,'small')}</div><div class="env-h disp goldtxt" style="margin:3vh 0 0">E O OSCAR VAI PARA...</div>`);
    drumStart();
    later(250,()=>$('.env')&&$('.env').classList.add('open'));
    later(2600,()=>{
      drumStop();crash();
      if(!ws.length){scene(`<div class="w-k disp in">${esc(c.emoji||'')} ${esc(c.nome)}</div><div class="c-t disp goldtxt pop" style="margin-top:4vh">NINGUÉM VOTOU 😅</div>`);return}
      const two=ws.length>1;
      scene(`<div class="w-k disp in">${esc(c.emoji||'🏆')} ${esc(c.nome.toUpperCase())}${two?' · EMPATE!':''}</div>
        <div class="w-row">${ws.map(w=>`<div class="w pop ${two?'two':''}"><div class="rays"></div>${avatar(w.name,w.unit,w.photo_url)}<div class="w-n disp goldtxt">${esc(w.name)}</div>${chipBig(w.unit)}${w.sub?`<div class="w-c">${esc(w.sub)}</div>`:''}</div>`).join('')}</div>`);
      confetti();later(350,fanfare);
      saveResult(c,ws,{total:r.total});
    });
  }
  else if(s.k==='discurso'){
    const ws=resultOf(c).winners,secs=+CFG.discurso_seg||30;let left=secs;
    scene(`<div class="w-k disp in">🎤 DISCURSO ${ws.length?'· '+ws.map(w=>esc(w.name)).join(' & '):''}</div><div class="cd disp goldtxt" id="cd">${left}</div><div class="c-d" style="font-style:normal">segundos de fama 😄</div>`);
    cdTimer=setInterval(()=>{left--;const el=$('#cd');if(!el)return;
      if(left>0){el.textContent=left;el.classList.toggle('low',left<=5);if(left<=5)tick(false)}
      else{clearInterval(cdTimer);cdTimer=null;el.textContent='⏰';el.classList.remove('low');$('.c-d').textContent='Tempo esgotado! Aplausos! 👏';playoff()}},1000);
  }
  else if(s.k==='podio'){
    const P=podium(),place=s.p;
    // ordem no palco: 2º | 1º | 3º
    const slot=[1,0,2],h={0:'100%',1:'72%',2:'52%'},medal=['🥇','🥈','🥉'];
    scene(`<div class="w-k disp">${esc(c.emoji||'🏢')} ${esc(c.nome.toUpperCase())}</div><div class="pod">${slot.map(k=>{const u=P[k];if(!u)return'';const un=unitOf(u.unit);
      return `<div class="pl ${k+1>=place?'on':''}" data-k="${k}"><div class="who"><div class="un disp" style="color:${un.cor}">${esc(un.nome)}</div><div class="pts disp">${u.score} PONTOS</div>
        <div class="det">🏆 ${String(u.oscar).replace('.',',')} estatueta${u.oscar===1?'':'s'} · 🎤 ${u.karaoke} pts no karaokê</div></div>
        <div class="blk" style="height:${h[k]};background:linear-gradient(180deg,${un.cor},${un.cor}aa)">${medal[k]}</div></div>`}).join('')}</div>`);
    // só o lugar da vez anima: os anteriores já aparecem prontos
    const el=document.querySelector(`.pl[data-k="${place-1}"]`);
    if(el){el.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')))}
    if(place===1){later(900,()=>{crash();confetti(220);later(300,fanfare)});saveResult(c,P[0]?[{name:unitOf(P[0].unit).nome,unit:P[0].unit}]:[],{podio:P})}
    else later(600,whoosh);
  }
  else if(s.k==='fim'){
    scene(`<div class="in"><div class="statue">🏆</div><div class="op-t disp goldtxt" style="font-size:clamp(80px,13vw,250px)">OBRIGADO!</div>
      <div class="op-s disp goldtxt">E QUE VENHA ${new Date().getFullYear()+1}!</div><div class="c-d" style="font-style:normal">${esc(C.MARCA)} · ${esc(C.EVENTO)}</div></div>`);
    shimmer();later(500,()=>confetti(120));
  }
  try{localStorage.setItem('o_tv_step',s.id)}catch(e){}
  sendState();
}
const envHtml=(c,cls)=>`<div class="env ${cls}"><div class="back"></div><div class="card"><b>${esc((c.emoji||'')+' '+c.nome)}</b></div><div class="front"></div><div class="flap"></div><div class="seal">PJ</div></div>`;

/* ===================== roteiro para o admin ===================== */
const NL=String.fromCharCode(10);
function scriptOf(s){
  if(!s)return'';const c=s.c;
  if(s.k==='abertura')return `Boa noite, ${C.MARCA}! 🎉\nSejam muito bem-vindos ao ${O.titulo}!\nHoje a gente premia quem faz a casa acontecer todo dia. Votos contados, envelopes lacrados... preparados?`;
  if(s.k==='retro'){const R=O.retro(PERF);return s.p===1?`Antes das estatuetas, um replay do karaokê!
Hoje foram ${R.total} músicas, ${R.cantores} cantores e ${R.duetos} duetos, com nota média ${R.media}. 👏`
    :['E os destaques da noite:',R.primeira&&`• Quem abriu a noite: ${R.primeira.name}${R.primeira.song?' com "'+R.primeira.song+'"':''}`,R.musica&&`• Música mais cantada: "${R.musica.song}" (${R.musica.n}x)`,R.cantor&&`• Dono(a) do microfone: ${R.cantor.name} (${R.cantor.n} músicas)`,R.unidade&&`• Unidade mais animada: ${unitOf(R.unidade.unit).nome}`].filter(Boolean).join(NL)}
  if(s.k==='titulo')return (c.roteiro||`Próxima categoria: ${c.nome}! ${c.descricao||''}`);
  if(s.k==='indicados'){const fs=resultOf(c).finalists;return `Os indicados são:\n${fs.map(f=>'• '+f.name+' ('+unitOf(f.unit).nome+')'+(f.sub?' — '+f.sub:'')).join('\n')}`}
  if(s.k==='envelope')return 'O envelope, por favor! 🥁\n(segura o suspense... deixa o tambor rolar)';
  if(s.k==='vencedor'){const ws=resultOf(c).winners;return ws.length?`E o Oscar vai para...\n${ws.map(w=>w.name.toUpperCase()+' ('+unitOf(w.unit).nome+')').join(' e ')}!${ws.length>1?'\nEMPATE! Os dois levam!':''}\nChama no palco! 👏👏👏`:'Ninguém votou nessa... 😅 Vamos para a próxima!'}
  if(s.k==='discurso')return `Microfone para quem ganhou: ${+CFG.discurso_seg||30} segundos de discurso! ⏱️\n(Espaço pula o contador)`;
  if(s.k==='podio'){const P=podium(),u=P[s.p-1];if(!u)return'';const n=unitOf(u.unit).nome;
    return s.p===1?`E a UNIDADE DO ANO é...\n${n.toUpperCase()}! 🏆🎉\n${u.score} pontos (${String(u.oscar).replace('.',',')} estatuetas + ${u.karaoke} pts no karaokê)`:`Em ${s.p}º lugar: ${n}, com ${u.score} pontos!`}
  if(s.k==='fim')return `Obrigado a todos! 🙌\nParabéns aos vencedores e a todas as unidades. Feliz ano novo e bora pra festa! 🎉`;
  return '';
}
const bus=store.bus('oscar',async(ev,p)=>{
  if(ev!=='cmd')return;
  if(!(await store.verifyToken(p.tok)))return; // só o admin logado manda na cerimônia
  if(p.k==='ping'){sendState();return}
  unlock();
  if(p.k==='next')go(1);else if(p.k==='back')go(-1);else if(p.k==='repeat')show();else if(p.k==='goto'&&STEPS[p.i]){I=p.i;show()}
});
function sendState(){const s=STEPS[I];if(!s)return;const n=STEPS[I+1];
  bus.send('state',{i:I,label:`${I+1}/${STEPS.length} · ${s.label}${n?'  →  próximo: '+n.label:''}`,script:scriptOf(s),steps:STEPS.map(x=>x.label)})}
setInterval(sendState,6000);

/* ===================== controle ===================== */
function go(d){const j=Math.max(0,Math.min(STEPS.length-1,I+d));if(j===I&&d>0&&STEPS[I].k==='discurso'){return}if(j!==I){I=j;show()}}
let started=false;
function unlock(){if(started)return;started=true;audio();$('#start').classList.add('hidden');show()}
$('#start').onclick=unlock;
document.addEventListener('keydown',e=>{
  if(document.querySelector('.kdlg'))return;
  const k=e.key;
  if(!started&&(k===' '||k==='Enter')){e.preventDefault();unlock();return}
  if(k===' '||k==='Enter'||k==='ArrowRight'||k==='PageDown'){e.preventDefault();unlock();go(1)}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(-1)}
  else if(k.toLowerCase()==='r'){show()}
  else if(k.toLowerCase()==='t'||k==='F11'){e.preventDefault();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
  else if(k.toLowerCase()==='h'){$('#hint').classList.toggle('off')}
  else if(k==='Home'){I=0;show()}
});
let mT=null;document.addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(mT);mT=setTimeout(()=>document.body.classList.remove('mouse'),2500)});

/* ===================== login ===================== */
let ADMIN=true;
function kLogin(){return new Promise(res=>{
  const ov=document.createElement('div');ov.className='kdlg';
  ov.innerHTML='<div class="kbox"><div style="font-size:34px">🔒</div><div class="disp goldtxt" style="font-size:30px">Telão da cerimônia</div><div>Senha do telão (para ler os votos).</div><input type="password" id="kpw" autocomplete="current-password"><div class="kerr" id="kerr"></div><button id="kgo">Entrar</button></div>';
  document.body.appendChild(ov);const pw=ov.querySelector('#kpw'),er=ov.querySelector('#kerr');pw.focus();
  const go2=async()=>{if(!pw.value)return;er.textContent='Entrando...';try{await store.signIn(pw.value);ov.remove();res(true)}catch(e){er.textContent=/invalid/i.test(e.message||'')?'Senha errada.':'Erro: '+(e.message||e)}};
  pw.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')go2()});ov.querySelector('#kgo').onclick=go2})}
(async()=>{
  if(store.mode==='supabase'){ADMIN=await store.isAdmin();if(!ADMIN){ADMIN=await kLogin()}}
  await load();
  let saved='';try{saved=localStorage.getItem('o_tv_step')||''}catch(e){}
  const j=STEPS.findIndex(s=>s.id===saved);if(j>0)I=j;
  scene(`<div class="in"><div class="op-t disp goldtxt" style="font-size:clamp(80px,14vw,260px)">OSCAR</div></div>`);
  sendState();
})();
</script>
