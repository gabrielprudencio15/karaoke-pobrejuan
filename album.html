<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0908">
<title>Álbum da festa</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/karaoke-store.js?v=202611170900"></script>
<script src="js/oscar-core.js?v=202611170900"></script>
<style>
:root{--bg:#0b0908;--panel:#161210;--panel2:#201a17;--line:#352b25;--txt:#f6f1ec;--dim:#a39588;--acc:#d67e59;--gold:#d9b46a;--ink:#0f0806}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 520px at 50% -10%,#3a2c12,var(--bg));color:var(--txt);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
.disp{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.gold{padding-top:.12em;background:linear-gradient(180deg,#fff3c9,var(--gold) 45%,#8a6a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
header{text-align:center;padding:10px 0 6px}
header img{height:46px}
header h1{font-size:clamp(46px,9vw,92px);line-height:.9;margin:8px 0 0}
header p{color:var(--dim);margin:6px 0 0}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;cursor:pointer}
button.pri{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:800}
h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:1px;color:var(--gold);margin:34px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.st b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:46px;line-height:1;color:var(--gold)}
.st small{color:var(--dim)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.hl div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hl small{color:var(--dim);display:block}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;color:var(--ink);margin-left:6px;vertical-align:middle}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.win{background:linear-gradient(160deg,#2a2010,var(--panel));border:1px solid #6b5426;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.win .em{font-size:30px}
.win small{color:var(--dim);display:block;font-size:12px}
.win b{font-size:17px}
.av{width:52px;height:52px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--gold);flex:none}
.av span{font-family:"Bebas Neue",Impact,sans-serif;font-size:24px;color:var(--ink)}
.av img{width:100%;height:100%;object-fit:cover}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin-top:10px}
.pod div{flex:1;max-width:220px;text-align:center;border-radius:14px 14px 0 0;padding:12px 8px;color:var(--ink);font-weight:800}
.pod div span{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:34px;line-height:1}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-size:12px;text-transform:uppercase}
td.n{text-align:right;font-weight:800;color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.gal button{padding:0;border:none;background:none;border-radius:12px;overflow:hidden;aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gal button:hover img{transform:scale(1.05)}
.empty{color:var(--dim);text-align:center;padding:20px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,4,3,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:8px}
#lb .cap{color:var(--dim)}
#lb .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#prog{color:var(--gold);text-align:center;min-height:20px;margin-top:6px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.gal{grid-template-columns:repeat(3,1fr);gap:4px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="logo"></div>
    <h1 class="disp gold">ÁLBUM DA FESTA</h1>
    <p id="ev"></p>
    <div class="acts">
      <button class="pri" id="zipBtn">⬇️ Baixar todas as fotos</button>
      <button id="shareBtn">🔗 Compartilhar o álbum</button>
    </div>
    <div id="prog"></div>
  </header>
  <section id="sOscar"></section>
  <section id="sKar"></section>
  <section><h2>📸 Tapete vermelho</h2><div class="gal" id="gal"></div></section>
</div>
<div id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div><div class="row"><button id="lbPrev">‹</button><button class="pri" id="lbDl">⬇️ Baixar foto</button><button id="lbClose">Fechar</button><button id="lbNext">›</button></div></div>
<script>
const O=window.OSCAR,{C,store,esc,unitOf,chip,avatar}=O,$=s=>document.querySelector(s);
document.title='Álbum da festa · '+C.MARCA;
$('#logo').innerHTML=C.LOGO_URL?`<img src="${esc(C.LOGO_URL)}" alt="${esc(C.MARCA)}">`:'';
$('#ev').textContent=(C.MARCA||'')+' · '+(C.EVENTO||'');
let PH=[],LBI=0;

function renderOscar(cfg,cats){
  const R=cfg.resultado||{},cs=cats.filter(c=>R[c.id]&&c.tipo!=='unidade'&&(R[c.id].winners||[]).length);
  const U=R['unidade-do-ano'];
  if(!cs.length&&!U){$('#sOscar').innerHTML='';return}
  let h=`<h2>🏆 ${esc(O.titulo)}</h2><div class="wins">`+cs.map(c=>`<div class="win">${R[c.id].winners.length===1?avatar(R[c.id].winners[0].name,R[c.id].winners[0].unit,R[c.id].winners[0].photo_url):`<div class="em">${esc(c.emoji||'🏆')}</div>`}<div><small>${esc((c.emoji||'')+' '+c.nome)}</small>${R[c.id].winners.map(w=>`<b>${esc(w.name)}</b>${chip(w.unit)}`).join('<br>')}</div></div>`).join('')+'</div>';
  if(U&&U.podio&&U.podio.length){const P=U.podio,ord=[1,0,2],hh=['150px','115px','90px'],md=['🥇','🥈','🥉'];
    h+=`<h2>🏢 Unidade do Ano</h2><div class="pod">${ord.map(k=>{const u=P[k];if(!u)return'';const un=unitOf(u.unit);return `<div style="background:${un.cor};height:${hh[k]}">${md[k]}<span>${esc(un.nome)}</span>${u.score} pts</div>`}).join('')}</div>`}
  $('#sOscar').innerHTML=h;
}
function renderKar(perfs){
  const ps=perfs.filter(p=>p.final!=null);if(!ps.length){$('#sKar').innerHTML='';return}
  const R=O.retro(ps),soma=C.RANKING_UNIDADES==='soma';
  const us=C.UNIDADES.map(u=>{const x=ps.filter(p=>p.unit===u.id),s=x.reduce((a,p)=>a+p.final,0);return{u,n:x.length,v:soma?s:(x.length?Math.round(s/x.length):0)}}).sort((a,b)=>b.v-a.v);
  const top=[...ps].sort((a,b)=>b.final-a.final).slice(0,10);
  $('#sKar').innerHTML=`<h2>🎤 Karaokê das Unidades</h2>
    <div class="stats"><div class="st"><b>${R.total}</b><small>músicas cantadas</small></div><div class="st"><b>${R.cantores}</b><small>cantores</small></div><div class="st"><b>${R.duetos}</b><small>duetos</small></div><div class="st"><b>${R.media}</b><small>nota média</small></div></div>
    <div class="hl">${[R.primeira&&['🥇 Abriu a noite',R.primeira.name,R.primeira.unit],R.musica&&['🔁 Música mais cantada',R.musica.song+' ('+R.musica.n+'x)'],R.cantor&&['🎙️ Dono(a) do microfone',R.cantor.name+' · '+R.cantor.n+' músicas',R.cantor.unit]].filter(Boolean).map(([l,v,u])=>`<div><small>${l}</small><b>${esc(v)}</b>${u?chip(u):''}</div>`).join('')}</div>
    <h2 style="font-size:26px;margin-top:22px">Placar das unidades</h2>
    <table><thead><tr><th></th><th>Unidade</th><th>Apresentações</th><th style="text-align:right">${soma?'Pontos':'Média'}</th></tr></thead><tbody>${us.map((x,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||''}</td><td>${chip(x.u.id)}</td><td>${x.n}</td><td class="n">${x.v}</td></tr>`).join('')}</tbody></table>
    <h2 style="font-size:26px;margin-top:22px">As 10 maiores notas</h2>
    <table><tbody>${top.map((p,i)=>`<tr><td>${i+1}º</td><td><b>${esc(p.name)}</b>${chip(p.unit)}<br><small style="color:var(--dim)">${esc(p.song_title||'')}</small></td><td class="n">${p.final}</td></tr>`).join('')}</tbody></table>`;
}
function renderGal(){
  $('#gal').innerHTML=PH.length?PH.map((p,i)=>`<button data-i="${i}" aria-label="Foto de ${esc(p.autor||'')}"><img src="${esc(p.url)}" alt="" loading="lazy"></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Nenhuma foto aprovada ainda.</div>';
  $('#zipBtn').style.display=PH.length?'':'none';
}
$('#gal').onclick=e=>{const b=e.target.closest('button[data-i]');if(b)lb(+b.dataset.i)};
function lb(i){if(!PH.length)return;LBI=(i+PH.length)%PH.length;const p=PH[LBI];$('#lbImg').src=p.url;$('#lbCap').textContent=`📸 ${p.autor||''}${p.unit?' · '+unitOf(p.unit).nome:''} · ${LBI+1} de ${PH.length}`;$('#lb').classList.add('on')}
$('#lbPrev').onclick=()=>lb(LBI-1);$('#lbNext').onclick=()=>lb(LBI+1);$('#lbClose').onclick=()=>$('#lb').classList.remove('on');
$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').classList.remove('on')};
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='ArrowLeft')lb(LBI-1);else if(e.key==='ArrowRight')lb(LBI+1);else if(e.key==='Escape')$('#lb').classList.remove('on')});
const fname=(p,i)=>`festa-${String(i+1).padStart(3,'0')}-${String(p.autor||'foto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.jpg`;
async function blobOf(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#lbDl').onclick=async()=>{const p=PH[LBI];try{save(await blobOf(p.url),fname(p,LBI))}catch(e){window.open(p.url,'_blank')}};
const loadZip=()=>window.JSZip?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('não carregou o compactador'));document.head.appendChild(s)});
$('#zipBtn').onclick=async()=>{
  const b=$('#zipBtn');if(b.disabled)return;b.disabled=true;
  try{await loadZip();const z=new JSZip();let n=0,fail=0;
    for(let i=0;i<PH.length;i++){$('#prog').textContent=`Juntando as fotos... ${i+1} de ${PH.length}`;try{z.file(fname(PH[i],i),await blobOf(PH[i].url));n++}catch(e){fail++}}
    $('#prog').textContent='Compactando...';save(await z.generateAsync({type:'blob'}),'album-festa-'+(C.MARCA||'').replace(/\s+/g,'-').toLowerCase()+'.zip');
    $('#prog').textContent=`✅ ${n} foto${n===1?'':'s'} baixada${n===1?'':'s'}`+(fail?` (${fail} não deu)`:'');
  }catch(e){$('#prog').textContent='Não deu para baixar: '+(e.message||e)}
  b.disabled=false;
};
$('#shareBtn').onclick=async()=>{const url=location.href.split('#')[0],t='Álbum da festa · '+C.MARCA;
  try{if(navigator.share){await navigator.share({title:t,url});return}await navigator.clipboard.writeText(url);$('#prog').textContent='🔗 Link copiado! É só colar no grupo.'}catch(e){}};
(async()=>{
  try{const [cfg,cats,perfs,ph]=await Promise.all([O.getConfig(),O.getCats(),store.list('performances'),store.list('oscar_photos')]);
    PH=ph.filter(p=>p.status==='approved').sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
    renderOscar(cfg,cats.filter(c=>c.ativa));renderKar(perfs);renderGal();
  }catch(e){$('#prog').textContent='Não deu para carregar: '+(e.message||e)}
})();
</script>
</body>
</html>
