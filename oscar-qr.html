<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oscar · QR Code</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/karaoke-store.js?v=202611170900"></script>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#e9e4dc;font-family:Montserrat,system-ui,sans-serif;color:#1a120b}
.bar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#161210;color:#f6f1ec}
.bar button,.bar select{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid #352b25;background:#201a17;color:#f6f1ec;cursor:pointer}
.bar button.pri{background:#d9b46a;border-color:#d9b46a;color:#0f0806;font-weight:800}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#0e0a07;color:#f6f1ec;padding:16mm 16mm 12mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#3a2a10 0%,transparent 65%);pointer-events:none}
.sheet>*{position:relative}
.logo{height:16mm;margin-bottom:6mm}
.disp{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.gold{padding-top:.12em;background:linear-gradient(180deg,#fff6d6,#e3bf6f 45%,#a3772c 80%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.k{font-size:6mm;letter-spacing:.5em;color:#e3bf6f}
.t{font-size:34mm;line-height:.85}
.s{font-size:12mm;margin-top:1mm}
.qr{background:#fff;padding:5mm;border-radius:6mm;margin:9mm 0 6mm;border:2mm solid #e3bf6f}
.qr img,.qr canvas{display:block;width:88mm;height:88mm}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;width:100%;margin-top:4mm}
.st{border:0.4mm solid #6b5426;border-radius:4mm;padding:4mm 3mm;font-size:4.2mm;line-height:1.35}
.st b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-size:9mm;color:#e3bf6f;font-weight:400}
.url{margin-top:6mm;font-size:4.4mm;color:#cdbfae;word-break:break-all}
.foot{margin-top:auto;padding-top:6mm;font-size:3.6mm;color:#a39588}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{body{background:#0e0a07}.bar{display:none}.sheet{margin:0;box-shadow:none;height:297mm}}
@media screen and (max-width:820px){.sheet{transform:scale(.46);transform-origin:top center;margin-bottom:-150mm}}
</style>
</head>
<body>
<div class="bar">
  <select id="pg"><option value="oscar">🏆 Oscar (indicar, votar, mandar foto)</option><option value="celular">🎤 Karaokê (entrar na fila)</option></select>
  <button class="pri" onclick="print()">🖨️ Imprimir</button>
  <span style="font-size:13px;color:#a39588">Dica: no Chrome, marque "Gráficos de plano de fundo" para sair o fundo preto.</span>
</div>
<div class="sheet">
  <img class="logo" id="logo" alt="">
  <div class="k" id="k"></div>
  <div class="t disp gold" id="t"></div>
  <div class="s disp gold" id="s"></div>
  <div class="qr" id="qr"></div>
  <div class="steps" id="steps"></div>
  <div class="url" id="url"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const C=window.KARAOKE_CONFIG,$=s=>document.querySelector(s);
const base=(C.LINK_CELULAR||new URL('./',location.href).href).replace(/[^/]*$/,'');
const PG={
  oscar:{k:(C.MARCA||'').toUpperCase()+' APRESENTA',t:'OSCAR',s:((C.OSCAR&&C.OSCAR.TITULO)||'OSCAR POBRE JUAN 2026').replace(/^OSCAR\s*/i,''),link:base+'oscar.html',
    steps:[['1','Aponte a câmera do celular para o QR Code'],['2','Indique os colegas e depois vote nos finalistas'],['3','Mande fotos da festa para o tapete vermelho 📸']]},
  celular:{k:'KARAOKÊ DAS UNIDADES',t:'KARAOKÊ',s:C.MARCA||'',link:base,
    steps:[['1','Aponte a câmera do celular para o QR Code'],['2','Escolha sua música e entre na fila'],['3','Vote nas apresentações e acompanhe o placar 🎤']]}
};
function render(){
  const p=PG[$('#pg').value];
  $('#logo').src=C.LOGO_URL||'';$('#logo').style.display=C.LOGO_URL?'':'none';
  $('#k').textContent=p.k;$('#t').textContent=p.t;$('#s').textContent=p.s;
  $('#qr').innerHTML='';new QRCode($('#qr'),{text:p.link,width:600,height:600,colorDark:'#0b0908',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  $('#steps').innerHTML=p.steps.map(([n,t])=>`<div class="st"><b>${n}</b>${t}</div>`).join('');
  $('#url').textContent=p.link.replace(/^https?:\/\//,'');
  $('#foot').textContent=C.EVENTO||'';
  document.title=p.t+' · QR Code';
}
const q=new URLSearchParams(location.search).get('p');if(q&&PG[q])$('#pg').value=q;
$('#pg').onchange=render;render();
</script>
</body>
</html>
