<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0908">
<title>Resultado das sugestões · Karaokê</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="karaoke-store.js?v=202611051400"></script>
<style>
:root{--bg:#0b0908;--panel:#161210;--panel2:#201a17;--line:#352b25;--txt:#f6f1ec;--dim:#a39588;--acc:#d67e59;--acc2:#c41d2c;--gold:#b09763;--ok:#4cc38a;--glow:#3b2418;--ink:#0f0806;--field:#0e0b0a}
html{color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,var(--glow),var(--bg));background-color:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header img{height:56px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:40px;letter-spacing:1px;margin:0;line-height:1}
h1 span{color:var(--acc)}
small,.dim{color:var(--dim);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:38px;line-height:1;color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input{flex:1;min-width:180px;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
.bar input:focus{border-color:var(--acc)}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr 150px 64px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.head{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;background:var(--panel2)}
.row .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;color:var(--dim);text-align:center}
.row:nth-child(-n+4) .n{color:var(--acc)}
.row .t{min-width:0}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{font-weight:800;font-size:18px;color:var(--gold);text-align:right}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--field)}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{padding:30px;text-align:center;color:var(--dim)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:10px 18px;border-radius:10px;z-index:99;font-size:14px}
@media (max-width:620px){.row{grid-template-columns:34px 1fr 54px}.row .mixc{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><img id="logo" alt="Pobre Juan"><div><h1>Sugestões do <span>karaokê</span></h1><small id="ev"></small></div></header>

  <div class="stats">
    <div class="stat"><b id="sPeople">—</b><small>pessoas responderam</small></div>
    <div class="stat"><b id="sSongs">—</b><small>músicas diferentes</small></div>
    <div class="stat"><b id="sVotes">—</b><small>sugestões no total</small></div>
    <div id="unitStats" style="display:contents"></div>
  </div>

  <div class="bar">
    <input id="f" type="text" placeholder="Filtrar por música ou artista">
    <span id="ufilter"></span>
    <button id="copy">📋 Copiar lista</button>
    <button id="csv" class="pri">⬇ Baixar planilha</button>
  </div>
  <div class="tbl" id="tbl"><div class="empty">Carregando...</div></div>
  <div class="legend" id="legend"></div>
  <p class="dim" style="margin-top:18px">A lista atualiza sozinha a cada 30 segundos. Use “Baixar planilha” para abrir no Excel e procurar os MP3s.</p>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=window.KARAOKE_CONFIG,store=window.KStore,UNITS=C.UNIDADES;
const unitOf=id=>UNITS.find(u=>u.id===id)||{id,nome:id||'?',cor:'#888'};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
$('#logo').src=C.LOGO_URL||'logo.svg';$('#ev').textContent=C.EVENTO+' · '+C.MARCA;

let ROWS=[],uSel='';
$('#ufilter').innerHTML=['',...UNITS.map(u=>u.id)].map(id=>`<button data-u="${esc(id)}" class="${id===uSel?'on':''}">${id?esc(unitOf(id).nome):'Todas'}</button>`).join(' ');
$('#ufilter').onclick=e=>{const b=e.target.closest('button');if(!b)return;uSel=b.dataset.u;[...$('#ufilter').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('#f').oninput=()=>render();
$('#legend').innerHTML=UNITS.map(u=>`<span><i style="background:${u.cor}"></i>${esc(u.nome)}</span>`).join('');

function grouped(){
  const rows=uSel?ROWS.filter(r=>r.unit===uSel):ROWS,m=new Map();
  for(const r of rows){const g=m.get(r.song_key)||{artist:r.artist||'',title:r.title,n:0,units:{}};g.n++;g.units[r.unit]=(g.units[r.unit]||0)+1;m.set(r.song_key,g)}
  return[...m.values()].sort((a,b)=>b.n-a.n||a.title.localeCompare(b.title,'pt'));
}
function render(){
  const people=new Set(ROWS.map(r=>r.device_id));
  $('#sPeople').textContent=people.size;$('#sSongs').textContent=new Set(ROWS.map(r=>r.song_key)).size;$('#sVotes').textContent=ROWS.length;
  $('#unitStats').innerHTML=UNITS.map(u=>{const n=new Set(ROWS.filter(r=>r.unit===u.id).map(r=>r.device_id)).size;return `<div class="stat" style="border-left:3px solid ${u.cor}"><b style="color:${u.cor}">${n}</b><small>pessoas de ${esc(u.nome)}</small></div>`}).join('');
  const q=$('#f').value.trim().toLowerCase(),list=grouped().filter(s=>!q||(s.title+' '+s.artist).toLowerCase().includes(q));
  $('#tbl').innerHTML=list.length?`<div class="row head"><span>#</span><span>Música</span><span class="mixc">Unidades</span><span style="text-align:right">Votos</span></div>`+
    list.map((s,i)=>`<div class="row"><span class="n">${i+1}</span><span class="t"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></span><span class="mixc"><span class="mix">${UNITS.map(u=>s.units[u.id]?`<i style="width:${s.units[u.id]/s.n*100}%;background:${u.cor}" title="${esc(u.nome)}: ${s.units[u.id]}"></i>`:'').join('')}</span></span><span class="c">${s.n}</span></div>`).join('')
    :`<div class="empty">${ROWS.length?'Nada encontrado com esse filtro.':'Ninguém respondeu ainda. Compartilhe o link do formulário! 🎤'}</div>`;
}
async function load(){try{ROWS=await store.list('sugestoes');render()}catch(e){console.error(e);$('#tbl').innerHTML='<div class="empty">Não deu para carregar. Verifique a internet.</div>'}}
setInterval(load,30000);load();

$('#csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['Posição','Artista','Música','Votos',...UNITS.map(u=>u.nome),'Nome do arquivo'].map(q).join(';')];
  grouped().forEach((s,i)=>lines.push([i+1,s.artist,s.title,s.n,...UNITS.map(u=>s.units[u.id]||0),(s.artist?s.artist+' - ':'')+s.title+'.mp3'].map(q).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='sugestoes-karaoke'+(uSel?'-'+uSel:'')+'.csv';a.click();
};
$('#copy').onclick=async()=>{
  const txt=grouped().map((s,i)=>`${i+1}. ${s.artist?s.artist+' - ':''}${s.title} (${s.n})`).join('\n');
  try{await navigator.clipboard.writeText(txt);toast('Lista copiada ✅')}catch(e){toast('Não deu para copiar')}
};
</script>
</body>
</html>
